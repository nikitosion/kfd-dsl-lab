name: http-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build
        shell: bash
        run: bash ./gradlew --no-daemon assemble
      - name: Tests
        shell: bash
        run: bash ./gradlew --no-daemon test
      - name: Source gate
        shell: bash
        run: |
          if grep -rnE '!!|lateinit' app/src/main/kotlin; then
            echo 'Найден запрещённый оператор или модификатор'
            exit 1
          else
            result=$?
            if [ "$result" -ne 1 ]; then exit "$result"; fi
          fi
